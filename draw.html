<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宜芝 & 博鈞 婚禮抽獎機</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #e5989b; /* 妳偏好的亮點色 */
            --secondary: #b5838d;
            --soft-pink: #ffeaec;
            --gold: #f4d35e;
        }
        
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(-45deg, #fffafb, #ffedef, #fff5f6, #fffafb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite; /* 動態流光背景 */
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 公主風裝飾：頂部花卉意象 */
        body::before {
            content: "🌸 ✨ 🕊️ ✨ 🌸";
            position: fixed; top: 10%; font-size: 24px; opacity: 0.4; letter-spacing: 20px;
        }

        .music-ctrl { position: fixed; top: 25px; right: 25px; z-index: 100; }
        #musicBtn {
            padding: 10px 25px; background: rgba(255, 255, 255, 0.9); color: var(--primary);
            border: 2px solid var(--primary); border-radius: 30px; cursor: pointer;
            font-weight: bold; box-shadow: 0 4px 15px rgba(229, 152, 155, 0.2);
        }

        h1 {
            color: var(--secondary); font-size: 48px; font-weight: 300;
            margin-top: 40px; letter-spacing: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        /* 號碼顯示大球：公主珍珠感 */
        #currentNum {
            font-size: 200px; font-weight: 900; color: var(--secondary);
            background: radial-gradient(circle at 30% 30%, #ffffff, #fff5f6);
            width: 320px; height: 320px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; border: 15px solid white;
            box-shadow: 0 30px 60px rgba(229, 152, 155, 0.2), inset 0 0 30px rgba(255,255,255,1);
            margin: 40px 0; position: relative;
        }

        /* 閃爍亮點特效 */
        #currentNum::after {
            content: "✨"; position: absolute; top: 10%; right: 10%; font-size: 40px;
            animation: sparkle 2s infinite;
        }
        @keyframes sparkle { 0%, 100% { opacity: 0; } 50% { opacity: 1; transform: scale(1.2); } }

        #drawBtn {
            padding: 22px 100px; font-size: 32px; background: var(--primary);
            color: white; border: none; border-radius: 60px; cursor: pointer;
            box-shadow: 0 10px 30px rgba(229, 152, 155, 0.4);
            font-weight: bold; transition: 0.4s;
        }
        #drawBtn:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(229, 152, 155, 0.5); }
        #drawBtn:disabled { background: #e0e0e0; box-shadow: none; }

        .history {
            width: 90%; max-width: 1100px; margin-top: 60px; text-align: center;
            background: rgba(255, 255, 255, 0.4); padding: 35px; border-radius: 40px;
            backdrop-filter: blur(10px); border: 2px solid white;
        }
        .history h3 { color: var(--secondary); margin-bottom: 25px; font-weight: 300; }
        .history-item {
            background: white; color: var(--primary); width: 65px; height: 65px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 50%; font-size: 28px; font-weight: bold; margin: 10px;
            box-shadow: 0 5px 15px rgba(229, 152, 155, 0.1); border: 1px solid var(--soft-pink);
        }

        /* 動態滾動效果 */
        .rolling { animation: shake 0.1s infinite; opacity: 0.8; }
        @keyframes shake { 0% { transform: scale(1.02); } 50% { transform: scale(0.98); } 100% { transform: scale(1.02); } }
        .pop { animation: popWinner 0.6s cubic-bezier(0.17, 0.89, 0.32, 1.49); }
        @keyframes popWinner { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="music-ctrl"><button id="musicBtn" onclick="toggleMusic()">🎵 播放浪漫背景音樂</button></div>

    <h1>✨ 宜芝 ＆ 博鈞 ✨</h1>
    
    <div id="currentNum">?</div>
    
    <button id="drawBtn" onclick="drawNumber()">抽出幸運兒</button>

    <div class="history">
        <h3>已揭曉的幸運號碼</h3>
        <div id="historyList"></div>
    </div>

    <audio id="bgMusic" loop><source src="bgm.mp3" type="audio/mpeg"></audio>

    <script>
        const bgMusic = document.getElementById('bgMusic');
        const display = document.getElementById('currentNum');
        const drawBtn = document.getElementById('drawBtn');
        let numbers = Array.from({length: 75}, (_, i) => i + 1);
        let history = [];

        function toggleMusic() {
            if (bgMusic.paused) { bgMusic.play(); document.getElementById('musicBtn').innerText = "⏸ 暫停音樂"; }
            else { bgMusic.pause(); document.getElementById('musicBtn').innerText = "🎵 播放音樂"; }
        }

        function drawNumber() {
            if (numbers.length === 0) return;
            drawBtn.disabled = true;
            display.classList.add('rolling');
            display.classList.remove('pop');

            let count = 0;
            let timer = setInterval(() => {
                display.innerText = Math.floor(Math.random() * 75) + 1;
                count++;
                if (count > 25) {
                    clearInterval(timer);
                    const idx = Math.floor(Math.random() * numbers.length);
                    const picked = numbers.splice(idx, 1)[0];
                    display.innerText = picked;
                    display.classList.remove('rolling');
                    display.classList.add('pop');
                    
                    // 彩帶噴發：特別加入金粉色調
                    confetti({
                        particleCount: 180,
                        spread: 80,
                        origin: { y: 0.6 },
                        colors: ['#e5989b', '#f4d35e', '#ffffff', '#ffb4a2']
                    });

                    history.unshift(picked);
                    setTimeout(() => { renderHistory(); drawBtn.disabled = false; }, 600);
                }
            }, 60);
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = "";
            history.forEach(num => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerText = num;
                list.appendChild(item);
            });
        }
    </script>
</body>
</html>
