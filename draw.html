<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宜芝 & 博鈞 婚禮抽獎機</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #e5989b;
            --secondary: #b5838d;
            --white-glass: rgba(255, 255, 255, 0.6);
        }
        
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            /* 模擬陽光灑落的背景：動態漸層 + 光暈 */
            background: linear-gradient(135deg, #fffafb 0%, #ffedef 50%, #fff5f6 100%);
            background-size: 400% 400%;
            animation: sunShine 10s ease infinite;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; overflow: hidden;
        }

        @keyframes sunShine {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 增加光點背景裝飾 */
        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle, #fff 10%, transparent 20%);
            background-size: 100px 100px; opacity: 0.3; pointer-events: none;
        }

        .music-ctrl { position: fixed; top: 20px; right: 20px; z-index: 100; }
        #musicBtn {
            padding: 8px 18px; background: var(--white-glass); color: var(--primary);
            border: 1.5px solid var(--primary); border-radius: 20px; cursor: pointer;
            backdrop-filter: blur(5px); font-size: 14px;
        }

        h1 {
            color: var(--secondary); font-size: 42px; font-weight: 300;
            letter-spacing: 6px; margin-bottom: 20px; z-index: 10;
        }

        /* 珍珠號碼球優化：增加柔和陰影與光澤 */
        #currentNum {
            font-size: 200px; font-weight: 900; color: var(--secondary);
            background: radial-gradient(circle at 35% 35%, #ffffff, #fffcfc);
            width: 320px; height: 320px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; border: 10px solid white;
            box-shadow: 0 30px 80px rgba(229, 152, 155, 0.25);
            margin: 20px 0; z-index: 10; position: relative;
        }

        #drawBtn {
            padding: 20px 90px; font-size: 30px; background: var(--primary);
            color: white; border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 10px 25px rgba(229, 152, 155, 0.4);
            font-weight: bold; transition: 0.3s; z-index: 10;
        }
        #drawBtn:hover { transform: scale(1.05); background: #d4878a; }

        /* 重新設計歷史紀錄區：呈現一體感 */
        .history {
            width: 100%; position: absolute; bottom: 0;
            background: linear-gradient(transparent, rgba(255, 255, 255, 0.8));
            padding: 40px 0 30px 0; text-align: center; backdrop-filter: blur(8px);
        }
        .history h3 { color: var(--secondary); font-size: 20px; font-weight: 300; margin-bottom: 15px; }
        #historyList { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; padding: 0 20px; }
        
        .history-item {
            background: rgba(255, 255, 255, 0.9); color: var(--primary);
            width: 55px; height: 55px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; font-size: 24px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid var(--soft-pink);
            animation: fadeInUp 0.5s ease;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 動態效果 */
        .rolling { animation: float 0.1s infinite; }
        @keyframes float { 0% { transform: translateY(0); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0); } }
        .pop { animation: popResult 0.6s cubic-bezier(0.17, 0.89, 0.32, 1.49); }
        @keyframes popResult { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="music-ctrl"><button id="musicBtn" onclick="toggleMusic()">🎵 播放背景音樂</button></div>

    <h1>✨ 宜芝 ＆ 博鈞 ✨</h1>
    
    <div id="currentNum">?</div>
    
    <button id="drawBtn" onclick="drawNumber()">抽出幸運號碼</button>

    <div class="history">
        <h3>已揭曉號碼</h3>
        <div id="historyList"></div>
    </div>

    <audio id="bgMusic" loop><source src="bgm.mp3" type="audio/mpeg"></audio>

    <script>
        const bgMusic = document.getElementById('bgMusic');
        const display = document.getElementById('currentNum');
        const drawBtn = document.getElementById('drawBtn');
        let numbers = Array.from({length: 75}, (_, i) => i + 1);
        let history = [];

        function toggleMusic() {
            if (bgMusic.paused) { bgMusic.play(); document.getElementById('musicBtn').innerText = "⏸ 暫停音樂"; }
            else { bgMusic.pause(); document.getElementById('musicBtn').innerText = "🎵 播放音樂"; }
        }

        function drawNumber() {
            if (numbers.length === 0) return;
            drawBtn.disabled = true;
            display.classList.add('rolling');
            display.classList.remove('pop');

            let count = 0;
            let timer = setInterval(() => {
                display.innerText = Math.floor(Math.random() * 75) + 1;
                count++;
                if (count > 25) {
                    clearInterval(timer);
                    const idx = Math.floor(Math.random() * numbers.length);
                    const picked = numbers.splice(idx, 1)[0];
                    display.innerText = picked;
                    display.classList.remove('rolling');
                    display.classList.add('pop');
                    
                    confetti({
                        particleCount: 150, spread: 70, origin: { y: 0.6 },
                        colors: ['#e5989b', '#f4d35e', '#ffffff']
                    });

                    history.unshift(picked);
                    setTimeout(() => { renderHistory(); drawBtn.disabled = false; }, 500);
                }
            }, 60);
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = "";
            history.forEach(num => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerText = num;
                list.appendChild(item);
            });
        }
    </script>
</body>
</html>
