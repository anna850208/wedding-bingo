<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博鈞 & 宜芝 婚禮抽獎機</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #e5989b; --secondary: #b5838d; --accent: #ffb4a2; }
        
        body {
            font-family: 'Noto Serif TC', serif;
            background: linear-gradient(135deg, #fffafb 0%, #ffedef 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; overflow: hidden; position: relative;
        }

        .decoration { position: absolute; color: var(--primary); opacity: 0.1; font-size: 180px; z-index: 0; pointer-events: none; }
        .top-left { top: -20px; left: -20px; transform: rotate(-15deg); }
        .bottom-right { bottom: -20px; right: -20px; transform: rotate(165deg); }

        /* 右上角音樂按鈕：字體統一為 Dancing Script */
        .music-ctrl { position: fixed; top: 30px; right: 30px; z-index: 100; }
        #musicBtn { 
            padding: 12px 28px; background: white; color: var(--primary); 
            border: 1.5px solid var(--primary); border-radius: 40px; cursor: pointer; 
            font-family: 'Dancing Script', cursive; font-size: 20px; /* 字體加大 */
            box-shadow: 0 4px 15px rgba(229, 152, 155, 0.2);
        }

        /* 歷史紀錄區：標題加大 */
        .history-top {
            position: fixed; top: 0; left: 0; width: 100%; padding: 70px 0 20px 0;
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(8px); z-index: 5;
            text-align: center; border-bottom: 1px solid rgba(255,255,255,0.4);
        }
        .history-top h3 { 
            font-family: 'Dancing Script', cursive; color: var(--secondary); 
            font-size: 36px; /* 標題大幅加大 */
            margin: 0 0 15px 0; letter-spacing: 2px;
        }
        #historyList { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; padding: 0 30px; }
        .history-item {
            background: white; color: var(--primary); width: 45px; height: 45px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; font-size: 20px; font-weight: bold; box-shadow: 0 3px 8px rgba(0,0,0,0.08);
        }

        /* 標題區：純中文與 Slogan */
        .header-section { text-align: center; margin-top: 120px; margin-bottom: 40px; z-index: 10; }
        .chi-name { 
            font-size: 68px; color: var(--secondary); font-weight: 700;
            letter-spacing: 20px; margin-bottom: 20px; display: block;
        }
        .wedding-slogan { 
            font-size: 28px; color: var(--secondary); font-weight: 300;
            letter-spacing: 10px; padding: 10px 50px;
            border-top: 1px solid var(--accent); border-bottom: 1px solid var(--accent);
            display: inline-block;
        }

        /* 主號碼球：大幅加大 */
        #currentNum {
            font-size: 220px; /* 數字加大 */
            font-weight: 900; color: var(--secondary);
            background: white; width: 380px; height: 380px; /* 球體加大 */
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; border: 18px solid white;
            box-shadow: 0 30px 80px rgba(229, 152, 155, 0.2);
            margin-bottom: 50px; z-index: 10;
        }

        #drawBtn {
            padding: 22px 120px; font-size: 32px; background: var(--primary);
            color: white; border: none; border-radius: 60px; cursor: pointer;
            box-shadow: 0 15px 40px rgba(229, 152, 155, 0.4);
            font-weight: 700; z-index: 10; letter-spacing: 6px; transition: 0.3s;
        }
        #drawBtn:hover { transform: scale(1.05); background: #d4878a; }
        #drawBtn:disabled { background: #eac0c2; transform: scale(1); }
    </style>
</head>
<body>
    <div class="decoration top-left">✿</div>
    <div class="decoration bottom-right">✿</div>

    <div class="music-ctrl">
        <button id="musicBtn" onclick="toggleMusic()">🎵 Wedding Day</button>
    </div>

    <!-- 歷史紀錄 -->
    <div class="history-top">
        <h3>Lucky Moments</h3>
        <div id="historyList"></div>
    </div>

    <div class="header-section">
        <span class="chi-name">博鈞 ＆ 宜芝</span>
        <div class="wedding-slogan">博得此生，宜然相守</div>
    </div>
    
    <div id="currentNum">?</div>
    
    <button id="drawBtn" onclick="drawNumber()">抽出幸運號碼</button>

    <audio id="bgMusic" loop><source src="bgm.mp3" type="audio/mpeg"></audio>

    <script>
        const bgMusic = document.getElementById('bgMusic');
        const display = document.getElementById('currentNum');
        const drawBtn = document.getElementById('drawBtn');
        let numbers = Array.from({length: 75}, (_, i) => i + 1);
        let history = [];

        function toggleMusic() {
            if (bgMusic.paused) { bgMusic.play(); document.getElementById('musicBtn').innerText = "⏸ Wedding Day"; }
            else { bgMusic.pause(); document.getElementById('musicBtn').innerText = "🎵 Wedding Day"; }
        }

        function drawNumber() {
            if (numbers.length === 0) return;
            drawBtn.disabled = true;
            let count = 0;
            let timer = setInterval(() => {
                display.innerText = Math.floor(Math.random() * 75) + 1;
                count++;
                if (count > 25) {
                    clearInterval(timer);
                    const idx = Math.floor(Math.random() * numbers.length);
                    const picked = numbers.splice(idx, 1)[0];
                    display.innerText = picked;
                    confetti({ particleCount: 200, spread: 80, origin: { y: 0.7 }, colors: ['#e5989b', '#ffb4a2', '#ffffff'] });
                    history.unshift(picked);
                    renderHistory();
                    drawBtn.disabled = false;
                }
            }, 60);
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = "";
            history.forEach(num => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerText = num;
                list.appendChild(item);
            });
        }
    </script>
</body>
</html>
