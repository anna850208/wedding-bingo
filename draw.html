<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宜芝 & 博鈞 婚禮抽獎機</title>
    <!-- 這是彩帶特效的核心程式，請務必保留 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #e5989b; --secondary: #b5838d; --light: #ffeaec; }
        body {
            font-family: "PingFang TC", sans-serif;
            background: linear-gradient(135deg, #fffafb 0%, #ffedef 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0;
        }
        .music-ctrl { position: fixed; top: 20px; right: 20px; z-index: 100; }
        #musicBtn { padding: 10px 20px; background: white; color: var(--primary); border: 2px solid var(--primary); border-radius: 30px; cursor: pointer; font-weight: bold; }
        h1 { color: var(--secondary); font-size: 40px; margin-top: 20px; }
        #currentNum {
            font-size: 200px; font-weight: 900; color: var(--secondary);
            background: white; width: 320px; height: 320px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; border: 12px solid white;
            box-shadow: 0 25px 60px rgba(229, 152, 155, 0.3); margin: 30px 0;
        }
        /* 抽獎震動效果 */
        .rolling { animation: shake 0.1s infinite; }
        @keyframes shake { 0% { transform: rotate(0deg); } 50% { transform: rotate(2deg); } 100% { transform: rotate(0deg); } }
        /* 定格放大效果 */
        .pop { animation: pop 0.5s cubic-bezier(0.17, 0.89, 0.32, 1.49); }
        @keyframes pop { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }

        #drawBtn {
            padding: 20px 80px; font-size: 30px; background: var(--primary);
            color: white; border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 10px 20px rgba(229, 152, 155, 0.4); font-weight: bold;
        }
        .history { width: 85%; margin-top: 40px; text-align: center; background: rgba(255,255,255,0.5); padding: 20px; border-radius: 30px; }
        .history-item { background: white; color: var(--primary); width: 60px; height: 60px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 25px; font-weight: bold; margin: 8px; border: 2px solid var(--light); }
    </style>
</head>
<body>
    <div class="music-ctrl"><button id="musicBtn" onclick="toggleMusic()">🎵 播放音樂</button></div>
    <h1>✨ 宜芝 ＆ 博鈞 ✨</h1>
    <div id="currentNum">?</div>
    <button id="drawBtn" onclick="drawNumber()">抽出幸運號碼</button>
    <div class="history"><h3>已揭曉號碼</h3><div id="historyList"></div></div>

    <audio id="bgMusic" loop><source src="bgm.mp3" type="audio/mpeg"></audio>

    <script>
        const bgMusic = document.getElementById('bgMusic');
        const display = document.getElementById('currentNum');
        const drawBtn = document.getElementById('drawBtn');
        let numbers = Array.from({length: 75}, (_, i) => i + 1);
        let history = [];

        function toggleMusic() {
            if (bgMusic.paused) { bgMusic.play(); document.getElementById('musicBtn').innerText = "⏸ 暫停音樂"; }
            else { bgMusic.pause(); document.getElementById('musicBtn').innerText = "🎵 播放音樂"; }
        }

        function drawNumber() {
            if (numbers.length === 0) return;
            drawBtn.disabled = true;
            display.classList.add('rolling');
            display.classList.remove('pop');

            let count = 0;
            let timer = setInterval(() => {
                display.innerText = Math.floor(Math.random() * 75) + 1;
                count++;
                if (count > 25) {
                    clearInterval(timer);
                    const idx = Math.floor(Math.random() * numbers.length);
                    const picked = numbers.splice(idx, 1)[0];
                    display.innerText = picked;
                    display.classList.remove('rolling');
                    display.classList.add('pop');
                    
                    // 執行彩帶噴發
                    confetti({
                        particleCount: 150,
                        spread: 70,
                        origin: { y: 0.6 },
                        colors: ['#e5989b', '#b5838d', '#ffb4a2']
                    });

                    history.unshift(picked);
                    setTimeout(() => { renderHistory(); drawBtn.disabled = false; }, 500);
                }
            }, 60);
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = "";
            history.forEach(num => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerText = num;
                list.appendChild(item);
            });
        }
    </script>
</body>
</html>
