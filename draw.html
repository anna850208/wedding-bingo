<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宜芝 & 博鈞 婚禮抽獎機</title>
    <!-- 引入 Google Fonts 藝術字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Noto+Sans+TC:wght@300;900&family=Zeyada&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #e5989b;
            --secondary: #b5838d;
            --accent: #ffb4a2;
        }
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            /* 婚禮風格背景：粉嫩漸層搭配水彩花卉感 */
            background-color: #fffafb;
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 234, 236, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(255, 180, 162, 0.3) 0px, transparent 50%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; overflow: hidden;
            position: relative;
        }

        /* 裝飾性花卉（模擬藝術感） */
        body::before {
            content: "✿"; position: absolute; top: 5%; left: 5%; font-size: 80px; color: var(--accent); opacity: 0.2;
        }
        body::after {
            content: "✿"; position: absolute; bottom: 5%; right: 5%; font-size: 100px; color: var(--primary); opacity: 0.2;
        }

        .music-ctrl { position: fixed; top: 20px; right: 20px; z-index: 100; }
        #musicBtn {
            padding: 8px 20px; background: white; color: var(--primary);
            border: 1.5px solid var(--primary); border-radius: 30px; cursor: pointer;
            font-family: 'Dancing Script', cursive; font-size: 18px;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--secondary); font-size: 55px; margin: 0;
            letter-spacing: 2px;
        }
        .couple-names {
            font-family: 'Noto Sans TC', sans-serif; font-weight: 300;
            font-size: 24px; color: var(--secondary); margin-bottom: 20px;
        }

        /* 珍珠感大球：增加藝術陰影 */
        #currentNum {
            font-size: 180px; font-weight: 900; color: var(--secondary);
            background: white; width: 300px; height: 300px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; border: 12px solid white;
            box-shadow: 0 20px 60px rgba(229, 152, 155, 0.15);
            margin-bottom: 30px; position: relative; z-index: 5;
        }

        #drawBtn {
            padding: 18px 80px; font-size: 28px; background: var(--primary);
            color: white; border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 10px 25px rgba(229, 152, 155, 0.3);
            font-family: 'Noto Sans TC', sans-serif; font-weight: 700;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #drawBtn:hover { transform: scale(1.05); background: #d4878a; }

        /* 歷史紀錄區：改為優雅的底欄 */
        .history {
            width: 100%; position: absolute; bottom: 0;
            background: rgba(255, 255, 255, 0.6); padding: 30px 0;
            backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,0.8);
        }
        .history h3 { 
            font-family: 'Dancing Script', cursive; color: var(--secondary); 
            font-size: 28px; margin: 0 0 15px 0; 
        }
        #historyList { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
        .history-item {
            background: white; color: var(--primary); width: 50px; height: 50px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; font-size: 22px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid var(--soft-pink);
        }

        /* 動態效果 */
        .rolling { animation: bounce 0.1s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-5px); } }
        .pop { animation: popResult 0.5s ease-out; }
        @keyframes popResult { 0% { transform: scale(0); } 80% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="music-ctrl"><button id="musicBtn" onclick="toggleMusic()">Music: Wedding Day</button></div>

    <h1>✨ Zhixin & Bojun ✨</h1>
    <div class="couple-names">宜芝 ＆ 博鈞的幸福時刻</div>
    
    <div id="currentNum">?</div>
    
    <button id="drawBtn" onclick="drawNumber()">抽出幸運號碼</button>

    <div class="history">
        <h3>Lucky Numbers</h3>
        <div id="historyList"></div>
    </div>

    <audio id="bgMusic" loop><source src="bgm.mp3" type="audio/mpeg"></audio>

    <script>
        const bgMusic = document.getElementById('bgMusic');
        const display = document.getElementById('currentNum');
        const drawBtn = document.getElementById('drawBtn');
        let numbers = Array.from({length: 75}, (_, i) => i + 1);
        let history = [];

        function toggleMusic() {
            if (bgMusic.paused) { bgMusic.play(); document.getElementById('musicBtn').innerText = "Pause Music"; }
            else { bgMusic.pause(); document.getElementById('musicBtn').innerText = "Play Music"; }
        }

        function drawNumber() {
            if (numbers.length === 0) return;
            drawBtn.disabled = true;
            display.classList.add('rolling');
            display.classList.remove('pop');

            let count = 0;
            let timer = setInterval(() => {
                display.innerText = Math.floor(Math.random() * 75) + 1;
                count++;
                if (count > 25) {
                    clearInterval(timer);
                    const idx = Math.floor(Math.random() * numbers.length);
                    const picked = numbers.splice(idx, 1)[0];
                    display.innerText = picked;
                    display.classList.remove('rolling');
                    display.classList.add('pop');
                    
                    confetti({
                        particleCount: 150, spread: 80, origin: { y: 0.6 },
                        colors: ['#e5989b', '#ffb4a2', '#ffffff']
                    });

                    history.unshift(picked);
                    setTimeout(() => { renderHistory(); drawBtn.disabled = false; }, 500);
                }
            }, 60);
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = "";
            history.forEach(num => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerText = num;
                list.appendChild(item);
            });
        }
    </script>
</body>
</html>
