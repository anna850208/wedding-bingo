<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博鈞 & 宜芝 婚禮抽獎機</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #e5989b; --secondary: #b5838d; --accent: #ffb4a2; }
        
        body {
            font-family: 'Noto Serif TC', serif;
            background: linear-gradient(135deg, #fffafb 0%, #ffedef 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            min-height: 100vh; margin: 0; overflow: hidden; padding-top: 5vh;
        }

        .decoration {
            position: absolute; color: var(--primary); opacity: 0.1; font-size: 180px; z-index: 0; pointer-events: none;
        }
        .top-left { top: -30px; left: -30px; transform: rotate(-15deg); }
        .bottom-right { bottom: -30px; right: -30px; transform: rotate(165deg); }

        .music-ctrl { position: fixed; top: 20px; right: 20px; z-index: 100; }
        #musicBtn { 
            padding: 8px 20px; background: rgba(255,255,255,0.9); color: var(--primary); 
            border: 1px solid var(--primary); border-radius: 30px; cursor: pointer; font-size: 13px;
        }

        /* 標題區：移除英文，聚焦中文與 Slogan */
        .header-section { text-align: center; margin-bottom: 30px; z-index: 10; }
        
        .chi-name { 
            font-size: 64px; color: var(--secondary); font-weight: 700;
            letter-spacing: 18px; /* 極寬間距 */
            margin: 20px 0; display: block;
        }

        .wedding-slogan { 
            font-size: 26px; color: var(--secondary); font-weight: 300;
            letter-spacing: 10px; margin-top: 10px;
            padding: 10px 40px; border-top: 1px solid var(--accent); border-bottom: 1px solid var(--accent);
            display: inline-block;
        }

        /* 主號碼球 */
        #currentNum {
            font-size: 180px; font-weight: 900; color: var(--secondary);
            background: white; width: 300px; height: 300px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; border: 12px solid white;
            box-shadow: 0 20px 60px rgba(229, 152, 155, 0.15);
            margin-bottom: 30px; z-index: 10;
        }

        #drawBtn {
            padding: 18px 90px; font-size: 28px; background: var(--primary);
            color: white; border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 10px 30px rgba(229, 152, 155, 0.3);
            font-weight: 700; z-index: 10; letter-spacing: 4px; transition: 0.2s;
        }
        #drawBtn:active { transform: scale(0.95); }

        /* 修正後的歷史紀錄區：不遮擋按鈕 */
        .history {
            width: 100%; position: fixed; bottom: 0; left: 0;
            background: rgba(255, 255, 255, 0.6); padding: 20px 0 30px 0;
            backdrop-filter: blur(10px); z-index: 5; border-top: 1px solid rgba(255,255,255,0.8);
            text-align: center;
        }
        .history h3 { font-family: 'Dancing Script', cursive; color: var(--secondary); font-size: 24px; margin: 0 0 15px 0; opacity: 0.8; }
        #historyList { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; max-height: 120px; overflow-y: auto; padding: 0 20px; }
        .history-item {
            background: white; color: var(--primary); width: 45px; height: 45px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; font-size: 20px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <div class="decoration top-left">✿</div>
    <div class="decoration bottom-right">✿</div>

    <div class="music-ctrl"><button id="musicBtn" onclick="toggleMusic()">🎵 Play Music</button></div>

    <div class="header-section">
        <span class="chi-name">博鈞 ＆ 宜芝</span>
        <div class="wedding-slogan">博得此生，宜然相守</div>
    </div>
    
    <div id="currentNum">?</div>
    
    <button id="drawBtn" onclick="drawNumber()">抽出幸運號碼</button>

    <div class="history">
        <h3>Lucky Numbers</h3>
        <div id="historyList"></div>
    </div>

    <audio id="bgMusic" loop><source src="bgm.mp3" type="audio/mpeg"></audio>

    <script>
        const bgMusic = document.getElementById('bgMusic');
        const display = document.getElementById('currentNum');
        const drawBtn = document.getElementById('drawBtn');
        let numbers = Array.from({length: 75}, (_, i) => i + 1);
        let history = [];

        function toggleMusic() {
            if (bgMusic.paused) { bgMusic.play(); document.getElementById('musicBtn').innerText = "⏸ Pause Music"; }
            else { bgMusic.pause(); document.getElementById('musicBtn').innerText = "🎵 Play Music"; }
        }

        function drawNumber() {
            if (numbers.length === 0) return;
            drawBtn.disabled = true;
            let count = 0;
            let timer = setInterval(() => {
                display.innerText = Math.floor(Math.random() * 75) + 1;
                count++;
                if (count > 20) {
                    clearInterval(timer);
                    const idx = Math.floor(Math.random() * numbers.length);
                    const picked = numbers.splice(idx, 1)[0];
                    display.innerText = picked;
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#e5989b', '#ffb4a2', '#ffffff'] });
                    history.unshift(picked);
                    renderHistory();
                    drawBtn.disabled = false;
                }
            }, 60);
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = "";
            history.forEach(num => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerText = num;
                list.appendChild(item);
            });
        }
    </script>
</body>
</html>
