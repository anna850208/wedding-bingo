<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博鈞 & 宜芝 婚禮抽獎機</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #e5989b; --secondary: #b5838d; --accent: #ffb4a2; --gold: #c5a059; }
        
        body {
            font-family: 'Noto Serif TC', serif;
            background: radial-gradient(circle at 50% 35%, #ffffff 0%, #fffbfb 100%);
            display: flex; flex-direction: column; align-items: center; 
            height: 100vh; margin: 0; padding: 0; box-sizing: border-box; overflow: hidden;
            position: relative;
        }

        .decoration { position: absolute; color: var(--primary); opacity: 0.1; font-size: 240px; z-index: 0; pointer-events: none; }
        .top-left { top: -60px; left: -60px; transform: rotate(-15deg); }
        .bottom-right { bottom: -60px; right: -60px; transform: rotate(165deg); }

        .music-ctrl { position: fixed; top: 20px; right: 20px; z-index: 100; }
        #musicBtn { 
            padding: 8px 20px; background: white; color: var(--secondary); border: 1px solid var(--accent); 
            border-radius: 40px; cursor: pointer; font-family: 'Dancing Script', cursive; font-size: 18px;
        }

        /* 頂部區域：拉高以容納更多號碼 */
        .history-section { width: 100%; text-align: center; padding-top: 20px; z-index: 10; min-height: 160px; }
        .history-section h3 { 
            font-family: 'Dancing Script', cursive; color: var(--secondary); 
            font-size: 38px; margin: 0 0 10px 0;
        }
        #historyList { 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; 
            max-height: 120px; padding: 0 10%; overflow-y: auto;
        }
        .history-item {
            background: white; color: var(--primary); width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; font-size: 18px; font-weight: bold; 
            box-shadow: 0 4px 10px rgba(229, 152, 155, 0.1); border: 1px solid #fdf0f1;
        }

        /* 中間舞台 */
        .mid-stage { flex: 1; display: flex; flex-direction: column; align-items: center; z-index: 10; width: 100%; position: relative; padding-top: 20px; }
        
        /* 照片區：往中間靠，並對齊 Slogan 高度 */
        .photo-container {
            position: absolute; 
            width: 90%; /* 控制照片不要貼邊 */
            top: 75px; /* 這裡手動微調以對齊 Slogan */
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; z-index: 5;
        }
        .photo-box { 
            width: 260px; height: 390px; 
            border: 1px dashed var(--accent); border-radius: 12px; 
            background: rgba(255,255,255,0.5); backdrop-filter: blur(2px);
            display: flex; align-items: center; justify-content: center;
            color: var(--secondary); font-size: 14px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .chi-name { 
            font-size: 46px; color: var(--secondary); font-weight: 700;
            letter-spacing: 12px; margin-bottom: 10px; margin-top: 10px;
        }

        .wedding-slogan { 
            font-size: 20px; font-weight: 300; letter-spacing: 10px; padding: 10px 50px;
            background: linear-gradient(to right, transparent, rgba(255,180,162,0.15), transparent);
            border-top: 1px solid var(--accent); border-bottom: 1px solid var(--accent);
            color: var(--gold); margin-bottom: 40px;
        }

        #currentNum {
            font-size: 130px; font-weight: 900; color: var(--secondary);
            background: white; width: 250px; height: 250px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; border: 12px solid white;
            box-shadow: 0 20px 70px rgba(181, 131, 141, 0.1);
        }

        /* 底部 */
        .bottom-stage { padding-bottom: 40px; z-index: 10; }
        #drawBtn {
            padding: 16px 85px; font-size: 26px; background: var(--primary);
            color: white; border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 10px 30px rgba(229, 152, 155, 0.3);
            font-weight: 700; letter-spacing: 4px;
        }
    </style>
</head>
<body>
    <div class="decoration top-left">✿</div>
    <div class="decoration bottom-right">✿</div>

    <div class="music-ctrl"><button id="musicBtn" onclick="toggleMusic()">🎵 Wedding Day</button></div>

    <div class="history-section">
        <h3>Lucky Moments</h3>
        <div id="historyList"></div>
    </div>

    <div class="mid-stage">
        <div class="photo-container">
            <div class="photo-box" id="groomBox">新郎照片<br>(對齊 Slogan)</div>
            <div class="photo-box" id="brideBox">新娘照片<br>(對齊 Slogan)</div>
        </div>

        <span class="chi-name">博鈞 ＆ 宜芝</span>
        <div class="wedding-slogan">博得此生，宜然相守</div>
        <div id="currentNum">?</div>
    </div>

    <div class="bottom-stage">
        <button id="drawBtn" onclick="drawNumber()">抽出幸運號碼</button>
    </div>

    <audio id="bgMusic" loop><source src="bgm.mp3" type="audio/mpeg"></audio>

    <script>
        const bgMusic = document.getElementById('bgMusic');
        const display = document.getElementById('currentNum');
        const drawBtn = document.getElementById('drawBtn');
        let numbers = Array.from({length: 75}, (_, i) => i + 1);
        let history = [];

        function toggleMusic() {
            if (bgMusic.paused) { bgMusic.play(); document.getElementById('musicBtn').innerText = "⏸ Wedding Day"; }
            else { bgMusic.pause(); document.getElementById('musicBtn').innerText = "🎵 Wedding Day"; }
        }

        function drawNumber() {
            if (numbers.length === 0) return;
            drawBtn.disabled = true;
            let count = 0;
            let timer = setInterval(() => {
                display.innerText = Math.floor(Math.random() * 75) + 1;
                count++;
                if (count > 20) {
                    clearInterval(timer);
                    const idx = Math.floor(Math.random() * numbers.length);
                    const picked = numbers.splice(idx, 1)[0];
                    display.innerText = picked;
                    confetti({ particleCount: 200, spread: 80, origin: { y: 0.7 } });
                    history.unshift(picked);
                    renderHistory();
                    drawBtn.disabled = false;
                }
            }, 60);
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = "";
            history.forEach(num => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerText = num;
                list.appendChild(item);
            });
        }
    </script>
</body>
</html>
