<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宜芝 & 博鈞 婚禮抽獎機</title>
    <!-- 引入藝術字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Noto+Serif+TC:wght@300;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #e5989b; --secondary: #b5838d; --accent: #ffb4a2; }
        
        body {
            font-family: 'Noto Serif TC', serif;
            background: linear-gradient(135deg, #fffafb 0%, #ffedef 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; overflow: hidden; position: relative;
        }

        /* 增加裝飾豐富度：背景大型浮水印花卉 */
        .bg-flower {
            position: absolute; font-size: 300px; color: var(--primary); 
            opacity: 0.08; pointer-events: none; z-index: 0;
        }
        .fl-1 { top: -50px; left: -50px; transform: rotate(-20deg); }
        .fl-2 { bottom: -50px; right: -100px; transform: rotate(160deg); }

        .music-ctrl { position: fixed; top: 20px; right: 20px; z-index: 100; }
        #musicBtn { 
            padding: 10px 20px; background: white; color: var(--primary); 
            border: 1px solid var(--primary); border-radius: 30px; cursor: pointer;
            font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* 標題區塊：徹底解決擁擠問題 */
        .slogan-container { text-align: center; margin-bottom: 40px; z-index: 10; }
        
        .names { 
            font-size: 56px; color: var(--secondary); font-weight: 600;
            letter-spacing: 12px; /* 增加字體間距 */
            margin: 15px 0;
            display: block;
        }

        .wedding-slogan { 
            font-size: 24px; color: var(--primary); font-weight: 300;
            letter-spacing: 6px; /* 增加 Slogan 間距 */
            margin-top: 15px;
            padding: 10px 30px;
            border-top: 1.5px solid var(--accent);
            border-bottom: 1.5px solid var(--accent);
            display: inline-block;
        }

        /* 珍珠感主號碼球 */
        #currentNum {
            font-size: 180px; font-weight: 900; color: var(--secondary);
            background: white; width: 320px; height: 320px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; border: 15px solid white;
            box-shadow: 0 25px 70px rgba(229, 152, 155, 0.25);
            margin-bottom: 40px; z-index: 10;
        }

        #drawBtn {
            padding: 20px 100px; font-size: 30px; background: var(--primary);
            color: white; border: none; border-radius: 60px; cursor: pointer;
            box-shadow: 0 15px 35px rgba(229, 152, 155, 0.3);
            font-weight: 600; transition: 0.3s; z-index: 10;
            letter-spacing: 4px;
        }
        #drawBtn:hover { transform: scale(1.05); background: #d4878a; }

        /* 歷史紀錄區：磨砂玻璃質感 */
        .history {
            width: 100%; position: absolute; bottom: 0;
            background: rgba(255, 255, 255, 0.4); padding: 35px 0;
            backdrop-filter: blur(10px); border-top: 1px solid white;
        }
        .history h3 { font-family: 'Dancing Script', cursive; color: var(--secondary); font-size: 26px; margin: 0 0 15px 0; }
        #historyList { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
        .history-item {
            background: white; color: var(--primary); width: 55px; height: 55px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; font-size: 24px; font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <div class="bg-flower fl-1">✿</div>
    <div class="bg-flower fl-2">✿</div>

    <div class="music-ctrl"><button id="musicBtn" onclick="toggleMusic()">🎵 Play Wedding Music</button></div>

    <div class="slogan-container">
        <span class="names">博鈞 ＆ 宜芝</span>
        <div class="wedding-slogan">博得此生，宜然相守</div>
    </div>
    
    <div id="currentNum">?</div>
    
    <button id="drawBtn" onclick="drawNumber()">抽出幸運號碼</button>

    <div class="history">
        <h3>Lucky Moments</h3>
        <div id="historyList"></div>
    </div>

    <audio id="bgMusic" loop><source src="bgm.mp3" type="audio/mpeg"></audio>

    <script>
        const bgMusic = document.getElementById('bgMusic');
        const display = document.getElementById('currentNum');
        const drawBtn = document.getElementById('drawBtn');
        let numbers = Array.from({length: 75}, (_, i) => i + 1);
        let history = [];

        function toggleMusic() {
            if (bgMusic.paused) { bgMusic.play(); document.getElementById('musicBtn').innerText = "⏸ Pause Music"; }
            else { bgMusic.pause(); document.getElementById('musicBtn').innerText = "🎵 Play Music"; }
        }

        function drawNumber() {
            if (numbers.length === 0) return;
            drawBtn.disabled = true;
            let count = 0;
            let timer = setInterval(() => {
                display.innerText = Math.floor(Math.random() * 75) + 1;
                count++;
                if (count > 25) {
                    clearInterval(timer);
                    const idx = Math.floor(Math.random() * numbers.length);
                    const picked = numbers.splice(idx, 1)[0];
                    display.innerText = picked;
                    confetti({ particleCount: 180, spread: 90, origin: { y: 0.6 }, colors: ['#e5989b', '#ffb4a2', '#ffffff'] });
                    history.unshift(picked);
                    setTimeout(() => { renderHistory(); drawBtn.disabled = false; }, 500);
                }
            }, 60);
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = "";
            history.forEach(num => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerText = num;
                list.appendChild(item);
            });
        }
    </script>
</body>
</html>
