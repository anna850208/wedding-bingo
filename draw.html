<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宜芝 & 博鈞 婚禮抽獎機</title>
    <style>
        body {
            font-family: "PingFang TC", sans-serif;
            background-color: #fffafb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #e5989b; font-size: 40px; margin-bottom: 5px; }
        
        /* 大數字顯示區 (維持大尺寸) */
        #currentNum {
            font-size: 180px;
            font-weight: 900;
            color: #b5838d;
            background: white;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 10px 40px rgba(229, 152, 155, 0.2);
            border: 10px solid #ffeaec;
            margin: 20px 0;
        }

        button {
            padding: 20px 50px;
            font-size: 28px;
            background-color: #e5989b;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(229, 152, 155, 0.4);
            transition: 0.3s;
            margin-bottom: 30px;
        }
        button:hover { background-color: #d4878a; transform: scale(1.05); }
        button:disabled { background-color: #ccc; }

        /* 重點調整：已抽過的號碼區塊 */
        .history {
            width: 95%;
            max-width: 1000px;
            text-align: center;
            background: rgba(255, 255, 255, 0.5);
            padding: 20px;
            border-radius: 20px;
        }
        .history h3 { 
            color: #b5838d; 
            font-size: 24px; 
            border-bottom: 2px solid #ffeaec; 
            padding-bottom: 10px; 
            margin-bottom: 20px;
        }
        #historyList {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        
        /* 加大後的號碼球樣式 */
        .history-item {
            background: #ffb4a2;
            color: white;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 28px; /* 號碼字體加大 */
            font-weight: 900;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <h1>✨ 宜芝 & 博鈞 婚禮賓果 ✨</h1>
    <div id="currentNum">?</div>
    <button id="drawBtn" onclick="drawNumber()">點擊抽號碼</button>

    <div class="history">
        <h3>已抽出的號碼 (由新到舊)</h3>
        <div id="historyList"></div>
    </div>

    <script>
        let numbers = Array.from({length: 75}, (_, i) => i + 1);
        let history = [];

        function drawNumber() {
            if (numbers.length === 0) {
                alert("所有號碼都抽完囉！");
                document.getElementById('drawBtn').disabled = true;
                return;
            }

            const btn = document.getElementById('drawBtn');
            const display = document.getElementById('currentNum');
            btn.disabled = true;

            let counter = 0;
            let timer = setInterval(() => {
                display.innerText = Math.floor(Math.random() * 75) + 1;
                counter++;
                if (counter > 15) {
                    clearInterval(timer);
                    finalizeDraw();
                }
            }, 60);
        }

        function finalizeDraw() {
            const randomIndex = Math.floor(Math.random() * numbers.length);
            const picked = numbers.splice(randomIndex, 1)[0];
            history.unshift(picked); // 新號碼排在最前面，方便看

            document.getElementById('currentNum').innerText = picked;
            
            // 更新歷史紀錄
            renderHistory();
            document.getElementById('drawBtn').disabled = false;
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = ""; // 重新渲染確保新號碼在最前
            history.forEach(num => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerText = num;
                list.appendChild(item);
            });
        }
    </script>
</body>
</html>
