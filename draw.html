<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博鈞 & 宜芝 婚禮抽獎機</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #e5989b; --secondary: #b5838d; --accent: #ffb4a2; --gold: #c5a059; }
        
        body {
            font-family: 'Noto Serif TC', serif;
            background: radial-gradient(circle at 50% 35%, #ffffff 0%, #fffbfb 100%);
            display: flex; flex-direction: column; align-items: center; 
            justify-content: space-between; height: 100vh; margin: 0; padding: 30px 0; box-sizing: border-box; overflow: hidden;
            position: relative;
        }

        /* 裝飾背景 */
        .decoration { position: absolute; color: var(--primary); opacity: 0.12; font-size: 240px; z-index: 0; pointer-events: none; }
        .top-left { top: -60px; left: -60px; transform: rotate(-15deg); }
        .bottom-right { bottom: -60px; right: -60px; transform: rotate(165deg); }

        .music-ctrl { position: fixed; top: 25px; right: 25px; z-index: 100; }
        #musicBtn { 
            padding: 10px 24px; background: white; color: var(--secondary); border: 1.5px solid var(--accent); 
            border-radius: 40px; cursor: pointer; font-family: 'Dancing Script', cursive; font-size: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        /* 頂部：Lucky Moments (間距拉開) */
        .history-section { width: 100%; text-align: center; margin-top: 40px; z-index: 10; }
        .history-section h3 { 
            font-family: 'Dancing Script', cursive; color: var(--secondary); 
            font-size: 40px; margin: 0 0 20px 0;
        }
        #historyList { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; max-height: 100px; padding: 0 15%; }
        .history-item {
            background: white; color: var(--primary); width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; font-size: 20px; font-weight: bold; 
            box-shadow: 0 4px 12px rgba(229, 152, 155, 0.15); border: 1px solid #fdf0f1;
        }

        /* 中間舞台：照片與內容 */
        .mid-stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; width: 100%; position: relative; }
        
        /* 照片預留區：大幅放大 */
        .photo-container {
            position: absolute; width: 100%; top: 50%; transform: translateY(-50%);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 3%; pointer-events: none; z-index: 5;
        }
        .photo-box { 
            width: 280px; height: 420px; /* 從 180x260 大幅增加 */
            border: 1px dashed var(--accent); border-radius: 15px; 
            background: rgba(255,255,255,0.4); backdrop-filter: blur(2px);
            display: flex; align-items: center; justify-content: center;
            color: var(--secondary); font-size: 14px; text-align: center;
            box-shadow: 0 15px 45px rgba(0,0,0,0.05);
        }

        .chi-name { 
            font-size: 42px; color: var(--secondary); font-weight: 700;
            letter-spacing: 12px; margin-bottom: 15px;
        }

        .wedding-slogan { 
            font-size: 18px; font-weight: 300; letter-spacing: 12px; padding: 12px 60px;
            background: linear-gradient(to right, transparent, rgba(255,180,162,0.18), transparent);
            border-top: 1px solid var(--accent); border-bottom: 1px solid var(--accent);
            color: var(--gold); margin-bottom: 45px;
        }

        #currentNum {
            font-size: 120px; font-weight: 900; color: var(--secondary);
            background: white; width: 230px; height: 230px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; border: 12px solid white;
            box-shadow: 0 20px 70px rgba(181, 131, 141, 0.1);
        }

        /* 底部：抽獎按鈕 */
        .bottom-stage { margin-bottom: 30px; z-index: 10; }
        #drawBtn {
            padding: 16px 90px; font-size: 28px; background: var(--primary);
            color: white; border: none; border-radius: 60px; cursor: pointer;
            box-shadow: 0 12px 35px rgba(229, 152, 155, 0.35);
            font-weight: 700; letter-spacing: 6px; transition: 0.3s;
        }
        #drawBtn:hover { transform: scale(1.05); box-shadow: 0 15px 40px rgba(229, 152, 155, 0.45); }
    </style>
</head>
<body>
    <div class="decoration top-left">✿</div>
    <div class="decoration bottom-right">✿</div>

    <div class="music-ctrl"><button id="musicBtn" onclick="toggleMusic()">🎵 Wedding Day</button></div>

    <div class="history-section">
        <h3>Lucky Moments</h3>
        <div id="historyList"></div>
    </div>

    <div class="mid-stage">
        <div class="photo-container">
            <div class="photo-box" id="groomBox">新郎照片預留區<br>(280 x 420)</div>
            <div class="photo-box" id="brideBox">新娘照片預留區<br>(280 x 420)</div>
        </div>

        <span class="chi-name">博鈞 ＆ 宜芝</span>
        <div class="wedding-slogan">博得此生，宜然相守</div>
        <div id="currentNum">?</div>
    </div>

    <div class="bottom-stage">
        <button id="drawBtn" onclick="drawNumber()">抽出幸運號碼</button>
    </div>

    <audio id="bgMusic" loop><source src="bgm.mp3" type="audio/mpeg"></audio>

    <script>
        const bgMusic = document.getElementById('bgMusic');
        const display = document.getElementById('currentNum');
        const drawBtn = document.getElementById('drawBtn');
        let numbers = Array.from({length: 75}, (_, i) => i + 1);
        let history = [];

        function toggleMusic() {
            if (bgMusic.paused) { bgMusic.play(); document.getElementById('musicBtn').innerText = "⏸ Wedding Day"; }
            else { bgMusic.pause(); document.getElementById('musicBtn').innerText = "🎵 Wedding Day"; }
        }

        function drawNumber() {
            if (numbers.length === 0) return;
            drawBtn.disabled = true;
            let count = 0;
            let timer = setInterval(() => {
                display.innerText = Math.floor(Math.random() * 75) + 1;
                count++;
                if (count > 22) {
                    clearInterval(timer);
                    const idx = Math.floor(Math.random() * numbers.length);
                    const picked = numbers.splice(idx, 1)[0];
                    display.innerText = picked;
                    confetti({ 
                        particleCount: 250, spread: 90, origin: { y: 0.65 }, 
                        colors: ['#ff0000', '#ffd700', '#ff69b4', '#00ff00', '#00e5ff', '#ffffff'] 
                    });
                    history.unshift(picked);
                    renderHistory();
                    drawBtn.disabled = false;
                }
            }, 60);
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = "";
            history.forEach(num => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerText = num;
                list.appendChild(item);
            });
        }
    </script>
</body>
</html>
