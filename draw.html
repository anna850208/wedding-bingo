<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宜芝 & 博鈞 婚禮抽獎機</title>
    <!-- 引入具備藝術感的字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Noto+Serif+TC:wght@300;600&family=Zeyada&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --primary: #e5989b; 
            --secondary: #b5838d; 
            --accent: #ffb4a2; 
            --gold: #d4af37;
        }
        
        body {
            font-family: 'Noto Serif TC', serif;
            background: linear-gradient(145deg, #fffafb 0%, #fff5f6 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; overflow: hidden;
            position: relative;
        }

        /* 增強婚禮背景元素：陽光與花瓣感 */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 10% 10%, rgba(255, 255, 255, 0.8) 0%, transparent 40%);
            pointer-events: none; z-index: 1;
        }
        
        /* 側邊裝飾 */
        .decor { position: fixed; font-size: 120px; color: var(--primary); opacity: 0.1; z-index: 0; pointer-events: none; }
        .top-l { top: -20px; left: -20px; transform: rotate(-10deg); }
        .bot-r { bottom: -20px; right: -20px; transform: rotate(170deg); }

        .music-ctrl { position: fixed; top: 20px; right: 20px; z-index: 100; }
        #musicBtn { 
            padding: 10px 25px; background: rgba(255,255,255,0.8); color: var(--primary); 
            border: 1px solid var(--primary); border-radius: 30px; cursor: pointer;
            backdrop-filter: blur(5px); font-size: 14px;
        }

        /* 標題與 Slogan 藝術化 */
        .slogan-box { text-align: center; margin-bottom: 30px; z-index: 10; }
        .eng-title { font-family: 'Dancing Script', cursive; font-size: 28px; color: var(--primary); margin-bottom: 5px; }
        .main-title { 
            font-size: 52px; color: var(--secondary); margin: 10px 0; 
            font-weight: 600; letter-spacing: 8px; text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
        }
        .wedding-slogan { 
            font-size: 22px; color: var(--secondary); letter-spacing: 4px; 
            border-top: 1px solid var(--accent); border-bottom: 1px solid var(--accent);
            padding: 8px 20px; display: inline-block; margin-top: 10px; font-weight: 300;
        }

        #currentNum {
            font-size: 180px; font-weight: 900; color: var(--secondary);
            background: white; width: 300px; height: 300px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; border: 15px solid white;
            box-shadow: 0 25px 70px rgba(229, 152, 155, 0.2);
            margin-bottom: 40px; position: relative; z-index: 10;
        }

        #drawBtn {
            padding: 20px 100px; font-size: 28px; background: var(--primary);
            color: white; border: none; border-radius: 60px; cursor: pointer;
            box-shadow: 0 15px 35px rgba(229, 152, 155, 0.3);
            font-weight: 600; transition: 0.3s; z-index: 10;
            letter-spacing: 2px;
        }
        #drawBtn:hover { transform: translateY(-3px); background: #d4878a; }

        /* 歷史紀錄區：一體化磨砂玻璃設計 */
        .history {
            width: 100%; position: absolute; bottom: 0;
            background: linear-gradient(transparent, rgba(255, 255, 255, 0.9));
            padding: 40px 0 30px 0; backdrop-filter: blur(10px); z-index: 5;
        }
        .history h3 { font-family: 'Dancing Script', cursive; color: var(--secondary); font-size: 24px; margin-bottom: 15px; }
        #historyList { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; padding: 0 40px; }
        .history-item {
            background: white; color: var(--primary); width: 55px; height: 55px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; font-size: 24px; font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); border: 1px solid #fff1f2;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="decor top-l">❀</div>
    <div class="decor bot-r">❀</div>

    <div class="music-ctrl"><button id="musicBtn" onclick="toggleMusic()">🎵 Play Wedding Song</button></div>

    <div class="slogan-box">
        <div class="eng-title">Forever Together</div>
        <div class="main-title">博鈞 ＆ 宜芝</div>
        <div class="wedding-slogan">博得此生，宜然相守</div>
    </div>
    
    <div id="currentNum">?</div>
    
    <button id="drawBtn" onclick="drawNumber()">抽出幸運號碼</button>

    <div class="history">
        <h3>LUCKY MOMENTS</h3>
        <div id="historyList"></div>
    </div>

    <audio id="bgMusic" loop><source src="bgm.mp3" type="audio/mpeg"></audio>

    <script>
        const bgMusic = document.getElementById('bgMusic');
        const display = document.getElementById('currentNum');
        const drawBtn = document.getElementById('drawBtn');
        let numbers = Array.from({length: 75}, (_, i) => i + 1);
        let history = [];

        function toggleMusic() {
            if (bgMusic.paused) { bgMusic.play(); document.getElementById('musicBtn').innerText = "⏸ Pause Music"; }
            else { bgMusic.pause(); document.getElementById('musicBtn').innerText = "🎵 Play Music"; }
        }

        function drawNumber() {
            if (numbers.length === 0) return;
            drawBtn.disabled = true;
            display.style.animation = "shake 0.1s infinite";
            
            let count = 0;
            let timer = setInterval(() => {
                display.innerText = Math.floor(Math.random() * 75) + 1;
                count++;
                if (count > 25) {
                    clearInterval(timer);
                    display.style.animation = "none";
                    const idx = Math.floor(Math.random() * numbers.length);
                    const picked = numbers.splice(idx, 1)[0];
                    display.innerText = picked;
                    
                    confetti({
                        particleCount: 180, spread: 90, origin: { y: 0.6 },
                        colors: ['#e5989b', '#ffb4a2', '#ffffff', '#ffd700']
                    });

                    history.unshift(picked);
                    setTimeout(() => { renderHistory(); drawBtn.disabled = false; }, 500);
                }
            }, 60);
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = "";
            history.forEach(num => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerText = num;
                list.appendChild(item);
            });
        }
    </script>
</body>
</html>
