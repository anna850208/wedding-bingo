<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博鈞 & 宜芝 婚禮抽獎機</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #e5989b; --secondary: #b5838d; --accent: #ffb4a2; --gold: #a67c52; --gold-light: #f3e5ab; }
        
        body {
            font-family: 'Noto Serif TC', serif;
            background: radial-gradient(circle at 50% 35%, #ffffff 0%, #fffbfb 100%);
            display: flex; flex-direction: column; align-items: center; 
            height: 100vh; margin: 0; padding: 0; box-sizing: border-box; overflow: hidden;
            position: relative;
        }

        .decoration { position: absolute; color: var(--primary); opacity: 0.08; font-size: 240px; z-index: 0; pointer-events: none; }
        .top-left { top: -60px; left: -60px; transform: rotate(-15deg); }
        .bottom-right { bottom: -60px; right: -60px; transform: rotate(165deg); }

        .music-ctrl { position: fixed; top: 20px; right: 20px; z-index: 100; }
        #musicBtn { 
            padding: 8px 20px; background: white; color: var(--secondary); border: 1px solid var(--accent); 
            border-radius: 40px; cursor: pointer; font-family: 'Dancing Script', cursive; font-size: 18px;
        }

        /* 號碼牆區域 */
        .history-section { width: 100%; text-align: center; padding-top: 15px; z-index: 20; min-height: 140px; }
        .history-section h3 { font-family: 'Dancing Script', cursive; color: var(--secondary); font-size: 34px; margin: 0 0 5px 0; }
        #historyList { display: grid; grid-template-columns: repeat(15, 34px); justify-content: center; gap: 6px; padding: 5px; }

        .history-item {
            background: white; color: var(--primary); width: 34px; height: 34px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; font-size: 16px; font-weight: bold; 
            box-shadow: 0 4px 10px rgba(229, 152, 155, 0.12); border: 1px solid #fdf0f1;
        }

        /* 依據 edited-image_4.png 整體下移，避免壓迫感 */
        .mid-stage { flex: 1; display: flex; flex-direction: column; align-items: center; z-index: 1; width: 100%; position: relative; padding-top: 60px; }
        
        .photo-container { position: absolute; width: 1200px; top: 90px; display: flex; justify-content: space-between; pointer-events: none; z-index: 5; }
        .photo-box { 
            width: 320px; height: 480px; border: 1px dashed var(--accent); border-radius: 15px; 
            background: rgba(255,255,255,0.2); backdrop-filter: blur(2px);
            display: flex; align-items: center; justify-content: center;
            color: var(--secondary); font-size: 16px; text-align: center;
        }

        .chi-name { 
            font-size: 44px; color: var(--secondary); font-weight: 700;
            letter-spacing: 12px; margin-bottom: 20px;
        }

        /* ✨ 強化效果：光影掃過流金色文字 */
        .wedding-slogan { 
            font-size: 22px; font-weight: 700; letter-spacing: 12px;
            padding: 12px 55px;
            background: linear-gradient(to right, var(--gold) 20%, var(--gold-light) 40%, var(--gold-light) 60%, var(--gold) 80%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            margin-bottom: 40px;
            animation: shine 4s linear infinite;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.1));
        }

        .wedding-slogan::before, .wedding-slogan::after {
            content: ""; position: absolute; left: 0; right: 0;
            height: 1.5px; background: linear-gradient(to right, transparent, var(--gold), transparent);
        }
        .wedding-slogan::before { top: 0; }
        .wedding-slogan::after { bottom: 0; }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        #currentNum {
            font-size: 110px; font-weight: 900; color: var(--secondary);
            background: white; width: 210px; height: 210px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; border: 10px solid white;
            box-shadow: 0 15px 50px rgba(181, 131, 141, 0.1);
            z-index: 10;
        }

        .bottom-stage { padding-bottom: 60px; z-index: 20; }
        #drawBtn {
            padding: 18px 100px; font-size: 24px; background: var(--primary);
            color: white; border: none; border-radius: 60px; cursor: pointer;
            box-shadow: 0 10px 30px rgba(229, 152, 155, 0.3);
            font-weight: 700; letter-spacing: 4px;
        }
    </style>
</head>
<body>
    <div class="decoration top-left">✿</div>
    <div class="decoration bottom-right">✿</div>

    <div class="music-ctrl"><button id="musicBtn" onclick="toggleMusic()">🎵 Wedding Day</button></div>

    <div class="history-section">
        <h3>Lucky Moments</h3>
        <div id="historyList"></div>
    </div>

    <div class="mid-stage">
        <div class="photo-container">
            <div class="photo-box" id="groomBox">新郎婚紗照</div>
            <div class="photo-box" id="brideBox">新娘婚紗照</div>
        </div>

        <span class="chi-name">博鈞 ＆ 宜芝</span>
        <div class="wedding-slogan">博得此生，宜然相守</div>
        <div id="currentNum">?</div>
    </div>

    <div class="bottom-stage">
        <button id="drawBtn" onclick="drawNumber()">抽出幸運號碼</button>
    </div>

    <audio id="bgMusic" loop><source src="bgm.mp3" type="audio/mpeg"></audio>

    <script>
        const bgMusic = document.getElementById('bgMusic');
        const display = document.getElementById('currentNum');
        const drawBtn = document.getElementById('drawBtn');
        let numbers = Array.from({length: 75}, (_, i) => i + 1);
        let history = [];

        function toggleMusic() {
            if (bgMusic.paused) { bgMusic.play(); document.getElementById('musicBtn').innerText = "⏸ Wedding Day"; }
            else { bgMusic.pause(); document.getElementById('musicBtn').innerText = "🎵 Wedding Day"; }
        }

        function drawNumber() {
            if (numbers.length === 0) return;
            drawBtn.disabled = true;
            let count = 0;
            let timer = setInterval(() => {
                display.innerText = Math.floor(Math.random() * 75) + 1;
                count++;
                if (count > 20) {
                    clearInterval(timer);
                    const idx = Math.floor(Math.random() * numbers.length);
                    const picked = numbers.splice(idx, 1)[0];
                    display.innerText = picked;
                    confetti({ particleCount: 200, spread: 80, origin: { y: 0.7 } });
                    history.push(picked);
                    renderHistory();
                    drawBtn.disabled = false;
                }
            }, 60);
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = "";
            history.forEach(num => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerText = num;
                list.appendChild(item);
            });
        }
    </script>
</body>
</html>
