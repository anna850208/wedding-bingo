<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宜芝 & 博鈞 Wedding Bingo</title>
    <style>
        body { 
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; 
            background-color: #fffafb; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 10px; margin: 0;
        }
        h1 { color: #e5989b; margin-top: 25px; font-size: 26px; letter-spacing: 2px; }
        .subtitle { color: #b5838d; font-size: 16px; margin-bottom: 20px; }

        .bingo-container {
            background: white; padding: 10px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(229, 152, 155, 0.15);
            border: 1px solid #ffeaec;
        }

        /* 調整重點：加大網格寬度到 350px (或更高) */
        .bingo-grid {
            display: grid; 
            grid-template-columns: repeat(5, 1fr);
            gap: 12px; /* 格子間距加大，比較不會點錯 */
            width: 350px; 
            max-width: 92vw; /* 確保在小手機上也不會超出螢幕 */
        }

        .cell {
            aspect-ratio: 1/1; background: #fffcfd;
            border: 2px solid #ffeaec; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            /* 調整重點：字體加大到 24px 並加粗 */
            font-size: 24px; 
            font-weight: 900; 
            color: #5d5461;
            cursor: pointer; transition: 0.2s;
        }

        .cell.active {
            background-color: #ffb4a2; color: white;
            border-color: #e5989b; transform: scale(0.92);
        }

        .cell.free { background-color: #ffcdb2; color: #6d6875; font-size: 16px; }

        .footer { margin-top: 30px; font-size: 14px; color: #b5838d; line-height: 1.6; text-align: center; }
    </style>
</head>
<body>

    <h1>✨ 宜芝 & 博鈞 ✨</h1>
    <div class="subtitle">讓幸福連成一線 🌸</div>

    <div class="bingo-container">
        <div class="bingo-grid" id="bingoBoard"></div>
    </div>

    <div class="footer">
        2027下半年 ‧ 期待與您分享幸福<br>
        ❤️ 執子之手，與子偕老 ❤️
    </div>

    <script>
        const board = document.getElementById('bingoBoard');
        let nums = [];
        for (let i = 1; i <= 75; i++) nums.push(i);
        function shuffle(array) { return array.sort(() => Math.random() - 0.5); }
        const selectedNums = shuffle([...nums]).slice(0, 25);

        selectedNums.forEach((num, index) => {
            const cell = document.createElement('div');
            cell.className = 'cell';
            if (index === 12) {
                cell.innerText = "FREE";
                cell.classList.add('active', 'free');
            } else {
                cell.innerText = num;
                cell.onclick = function() { this.classList.toggle('active'); };
            }
            board.appendChild(cell);
        });
    </script>
</body>
</html>
