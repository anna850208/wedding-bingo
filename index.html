<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宜芝 & 博鈞 Wedding Bingo</title>
    <style>
        /* 公主風配色：清新、明亮 */
        body { 
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; 
            background-color: #fffafb; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 10px; margin: 0;
        }
        h1 { color: #e5989b; margin-top: 30px; font-size: 24px; letter-spacing: 2px; text-shadow: 1px 1px 2px rgba(0,0,0,0.05); }
        .subtitle { color: #b5838d; font-size: 15px; margin-bottom: 25px; font-weight: 300; }

        /* 賓果外框 */
        .bingo-container {
            background: white; padding: 15px; border-radius: 25px;
            box-shadow: 0 10px 30px rgba(229, 152, 155, 0.15);
            border: 1px solid #ffeaec;
        }

        /* 5x5 網格 */
        .bingo-grid {
            display: grid; grid-template-columns: repeat(5, 1fr);
            gap: 10px; width: 330px;
        }

        .cell {
            aspect-ratio: 1/1; background: #fffcfd;
            border: 2px solid #ffeaec; border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: bold; color: #6d6875;
            cursor: pointer; transition: 0.3s;
        }

        /* 點選後的樣式 */
        .cell.active {
            background-color: #ffb4a2; color: white;
            border-color: #e5989b; transform: scale(0.92);
        }

        /* 中間 FREE 格 */
        .cell.free { background-color: #ffcdb2; color: #6d6875; font-size: 14px; }

        .footer { margin-top: 40px; font-size: 13px; color: #b5838d; line-height: 1.6; }
    </style>
</head>
<body>

    <h1>✨ 宜芝 & 博鈞 ✨</h1>
    <div class="subtitle">Welcome to Our Wedding Party!</div>

    <div class="bingo-container">
        <div class="bingo-grid" id="bingoBoard"></div>
    </div>

    <div class="footer">
        2027下半年 ‧ 期待與您分享幸福<br>
        ❤️ 執子之手，與子偕老 ❤️
    </div>

    <script>
        const board = document.getElementById('bingoBoard');
        
        // 1. 生成 1-75 的數字池
        let nums = [];
        for (let i = 1; i <= 75; i++) nums.push(i);

        // 2. 打亂數字
        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        // 3. 挑選 25 個不重複的數字
        const selectedNums = shuffle([...nums]).slice(0, 25);

        // 4. 渲染到網頁上
        selectedNums.forEach((num, index) => {
            const cell = document.createElement('div');
            cell.className = 'cell';
            
            if (index === 12) { // 正中間那一格
                cell.innerText = "FREE";
                cell.classList.add('active', 'free');
            } else {
                cell.innerText = num;
                cell.onclick = function() {
                    this.classList.toggle('active');
                };
            }
            board.appendChild(cell);
        });
    </script>
</body>
</html>
