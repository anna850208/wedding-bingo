<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Bingo</title>
    <style>
        body { font-family: "PingFang TC", sans-serif; background-color: #fffafb; display: flex; flex-direction: column; align-items: center; padding: 10px; }
        h1 { color: #e5989b; margin-top: 30px; font-size: 24px; letter-spacing: 2px; }
        .bingo-container { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 10px 25px rgba(229, 152, 155, 0.2); border: 1px solid #ffeaec; }
        .bingo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 320px; }
        .cell { aspect-ratio: 1/1; background: #fffcfd; border: 2px solid #ffeaec; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #6d6875; cursor: pointer; transition: 0.2s; }
        .cell.active { background-color: #ffb4a2; color: white; border-color: #e5989b; transform: scale(0.95); }
        .cell.free { background-color: #ffcdb2; color: #6d6875; font-size: 14px; }
        .footer { margin-top: 30px; font-size: 12px; color: #b5838d; }
    </style>
</head>
<body>
    <h1>Wedding Bingo</h1>
    <div class="bingo-container">
        <div class="bingo-grid" id="bingoBoard"></div>
    </div>
    <div class="footer">Waiting for our big day in 2027 ❤️</div>
    <script>
        const board = document.getElementById('bingoBoard');
        let nums = [];
        for (let i = 1; i <= 75; i++) nums.push(i);
        function shuffle(array) { return array.sort(() => Math.random() - 0.5); }
        const selectedNums = shuffle([...nums]).slice(0, 25);
        selectedNums.forEach((num, index) => {
            const cell = document.createElement('div');
            cell.className = 'cell';
            if (index === 12) {
                cell.innerText = "FREE";
                cell.classList.add('active', 'free');
            } else {
                cell.innerText = num;
                cell.onclick = function() { this.classList.toggle('active'); };
            }
            board.appendChild(cell);
        });
    </script>
</body>
</html>
